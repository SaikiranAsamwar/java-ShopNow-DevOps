apiVersion: v1
kind: Service
metadata:
  name: shopnow-frontend-service
  namespace: shopnow-app
  labels:
    app: shopnow-frontend
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: LoadBalancer
  selector:
    app: shopnow-frontend
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
